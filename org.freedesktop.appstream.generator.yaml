---
app-id: org.freedesktop.appstream.generator
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
 - org.freedesktop.Sdk.Extension.node24
command: appstream-generator
separate-locales: false

finish-args:
 - --filesystem=host
 - --share=network

cleanup-commands:
  - mkdir -p $FLATPAK_DEST/lib/ffmpeg

cleanup:
 - /include
 - /lib/pkgconfig
 - /lib/*.a
 - /lib/*.la
 - /share/installed-tests
 - /share/gir-1.0
 - /bin/girtod

modules:

- name: libfyaml
  buildsystem: autotools
  cleanup:
   - /bin
  sources:
   - type: archive
     url: https://github.com/pantoniou/libfyaml/releases/download/v0.9/libfyaml-0.9.tar.gz
     sha256: 7731edc5dfcc345d5c5c9f6ce597133991a689dabede393cd77bae89b327cd6d

- name: libxmlb
  buildsystem: meson
  config-opts:
   - -Dstemmer=false
   - -Dintrospection=false
   - -Dgtkdoc=false
  cleanup:
   - /share/man/man1/*
   - /bin/*
   - /app/libexec/installed-tests
  sources:
   - type: git
     url: https://github.com/hughsie/libxmlb.git
     tag: '0.3.24'

- name: appstream
  buildsystem: meson
  config-opts:
   - -Dcompose=true
   - -Dstemming=false
   - -Dapidocs=false
   - -Dman=false
  cleanup:
   - /share/metainfo/*
  sources:
   - type: git
     url: https://github.com/ximion/appstream.git
     tag: v1.1.1

- name: onetbb
  buildsystem: cmake-ninja
  config-opts:
   - -DCMAKE_BUILD_TYPE=Release
   - -DTBB_TEST=OFF
   - -DTBB_EXAMPLES=OFF
  sources:
   - type: git
     url: https://github.com/uxlfoundation/oneTBB.git
     tag: v2022.2.0

- name: lmdb
  no-autogen: true
  make-install-args:
   - prefix=/app
  subdir: libraries/liblmdb
  post-install:
   - install -D lmdb.pc /app/lib/pkgconfig/lmdb.pc
  cleanup:
   - /share/man/man1/*
   - /bin/*
  sources:
   - type: archive
     url: https://git.openldap.org/openldap/openldap/-/archive/LMDB_0.9.33/openldap-LMDB_0.9.33.tar.gz
     sha256: 476801f5239c88c7de61c3390502a5d13965ecedef80105b5fb0fcb8373d1e53
   - type: file
     path: extra/lmdb.pc
     dest: libraries/liblmdb/

- name: optipng
  build-options:
    config-opts:
     - --with-system-libs
  sources:
   - type: archive
     url: https://downloads.sourceforge.net/project/optipng/OptiPNG/optipng-7.9.1/optipng-7.9.1.tar.gz
     sha256: c2579be58c2c66dae9d63154edcb3d427fef64cb00ec0aff079c9d156ec46f29

- name: nlohmann-json
  buildsystem: meson
  sources:
   - type: archive
     url: https://github.com/nlohmann/json/archive/refs/tags/v3.12.0.tar.gz
     sha256: 4b92eb0c06d10683f7447ce9406cb97cd4b453be18d7279320f7b2f025c10187

- name: inja
  buildsystem: meson
  sources:
   - type: git
     url: https://github.com/pantor/inja.git
     commit: 7d1b4600b68595085a949743331c2e5673f511ea

- name: catch2
  buildsystem: cmake-ninja
  builddir: true
  config-opts:
   - -DCMAKE_BUILD_TYPE=RelWithDebInfo
  sources:
   - type: archive
     url: https://github.com/catchorg/Catch2/archive/refs/tags/v3.11.0.tar.gz
     sha256: 82fa1cb59dc28bab220935923f7469b997b259eb192fb9355db62da03c2a3137

- name: appstream-generator
  buildsystem: meson
  config-opts:
   - --wrap-mode=nofallback
   - -Ddownload-js=false
  build-options:
    append-path: /usr/lib/sdk/node24/bin
    env:
      XDG_CACHE_HOME: /run/build/appstream-generator/flatpak-node/cache
  build-commands:
   - HOME=$PWD MESON_SOURCE_ROOT=$PWD/.. ../contrib/setup/build_js.sh 'npm --offline --cache=/run/build/appstream-generator/npm-cache/'
  sources:
   - npm-sources.json
   - type: git
     url: https://github.com/ximion/appstream-generator.git
     tag: v0.10.1
